<div id="tab-autonomy-monitor" class="tab-panel layout">
  <section class="card autonomy-workspace-card">
    <div class="autonomy-workspace-head section-heading">
      <div>
        <p class="section-kicker">Autonomy</p>
        <h2>Account Monitoring Dashboard</h2>
        <p id="autonomyMeta" class="muted">Real-time status of books, workflow, and governance.</p>
      </div>
      <div class="section-actions">
        <button id="autonomyRefreshBtn" class="icon-label-button" type="button" aria-label="Refresh autonomy data">
          <svg class="button-icon-svg" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M3 21v-5h5"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </div>

    <div class="autonomy-account-selector">
      <label class="bt-field">
        <span>Select account</span>
        <select id="autonomyAccountSelect">
          <option value="">Loading accounts...</option>
        </select>
      </label>
    </div>

    <div id="autonomyDashboard" class="autonomy-dashboard empty">
      <p>Select an account to view monitoring dashboard.</p>
    </div>
  </section>
</div>
