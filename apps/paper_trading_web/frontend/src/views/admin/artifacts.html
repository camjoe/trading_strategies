<div class="admin-section-page" data-admin-section-panel="artifacts" hidden>
  <section class="card admin-card">
    <h2>Logs</h2>
    <p class="admin-note">Inspect runtime logs from <code>local/logs</code>.</p>
    <div class="log-controls">
      <select id="logFileSelect"></select>
      <input id="logFilterInput" placeholder="Filter text" />
      <button
        id="loadLogBtn"
        class="icon-button"
        type="button"
        aria-label="Load log"
        data-tooltip="Load log"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" class="button-icon-svg" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 5v14" />
          <path d="M19 12H9" />
          <path d="m14 7 5 5-5 5" />
        </svg>
      </button>
    </div>
    <div id="logOutput" class="log-output">Select a log file to begin.</div>
  </section>
</div>
