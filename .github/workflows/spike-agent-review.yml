name: Spike agent review

# Throwaway workflow for plan/agent-pipeline-automation.md, Phase 0. Never merge to develop.
# Runs only for same-repo PRs from spike/agent-review-ci, and never on drafts.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: spike-agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: read
  statuses: read

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.head_ref == 'spike/agent-review-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      ALLOWED_TOOLS: Read,Glob,Grep,Skill,Agent,Write,Bash(git:*),Bash(gh:*),Bash(python:*),Bash(.venv/bin/python:*),Bash(./.venv/bin/python:*),Bash(jq:*),Bash(cat:*),Bash(ls:*)

    steps:
      - name: Require the token secret
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not set as a repository secret." >&2
            exit 1
          fi

      - name: Checkout the PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Create the repo-local .venv (AGENTS.md requires it)
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Probe (items 1-3 - auth, skills, subagent)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/probe.txt" <<'EOF'
          Answer from this repository, without running any checks:
          1. What does the `pr ready` shortcut in AGENTS.md do, and what is its default base?
          2. List the six step names in .ai/skills/check-pr-readiness/SKILL.md.
          3. Use the Agent tool to spawn one subagent that counts the files directly inside plan/ and
             reports the number; include that number in your answer.
          Reply with three short labelled lines.
          EOF
          claude -p "$(cat "$RUNNER_TEMP/probe.txt")" \
            --output-format json \
            --allowedTools "$ALLOWED_TOOLS" \
            > "$RUNNER_TEMP/probe.json"
          echo "### Probe" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.result' "$RUNNER_TEMP/probe.json" >> "$GITHUB_STEP_SUMMARY"
          jq '{is_error, subtype, num_turns, duration_ms, total_cost_usd, usage, permission_denials}' \
            "$RUNNER_TEMP/probe.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: pr ready (items 4, 5, 7, 8)
        continue-on-error: true
        run: |
          cat > "$RUNNER_TEMP/review.txt" <<EOF
          Run \`pr ready\` for pull request #$PR_NUMBER (head $HEAD_SHA) against base origin/develop.
          You are in CI: use .venv/bin/python for every Python command, do not modify tracked files,
          and post or edit the single <!-- pr-readiness --> comment on this PR as Step 6 describes.
          If a step cannot run in this environment, say which step and why instead of skipping it.
          EOF
          prev="$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate             --jq '.[] | select(.body | startswith("<!-- pr-readiness -->")) | .body')"
          if [ -n "$prev" ]; then
            {
              echo
              echo "This is a LATER PASS. The previous readiness comment is below. Follow Step 4 (Later"
              echo "passes) and Step 6 exactly: edit this same comment, increment the pass number, keep"
              echo "every finding number, re-verify each open finding at the new HEAD, carry closed"
              echo "findings forward as checked one-liners, copy every Decision line unchanged, and give"
              echo "a reason for any finding you stop listing. Do not renumber."
              echo
              echo "PREVIOUS COMMENT:"
              echo "$prev"
            } >> "$RUNNER_TEMP/review.txt"
          fi
          claude -p "$(cat "$RUNNER_TEMP/review.txt")" \
            --output-format json \
            --allowedTools "$ALLOWED_TOOLS" \
            > "$RUNNER_TEMP/review.json"
          echo "### pr ready" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.result' "$RUNNER_TEMP/review.json" >> "$GITHUB_STEP_SUMMARY"
          jq '{is_error, subtype, num_turns, duration_ms, total_cost_usd, usage, permission_denials}' \
            "$RUNNER_TEMP/review.json" | tee -a "$GITHUB_STEP_SUMMARY"
