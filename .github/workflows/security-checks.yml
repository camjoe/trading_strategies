name: Security Checks

on:
  push:
    branches:
      - main
      - develop
    paths:
      - requirements-base.txt
      - requirements-dev.txt
      - apps/paper_trading_web/frontend/package-lock.json
      - .github/workflows/security-checks.yml
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: security-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_deps: ${{ steps.filter.outputs.python_deps }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect dependency changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python_deps:
              - requirements-base.txt
              - requirements-dev.txt
              - .github/workflows/security-checks.yml
            frontend_deps:
              - apps/paper_trading_web/frontend/package-lock.json
              - .github/workflows/security-checks.yml

  python-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install pip-audit
        run: uv pip install --system pip-audit

      - name: Run pip-audit for base dependencies
        run: |
          pip-audit -r requirements-base.txt -f json -o pip-audit-base.json || true
          pip-audit -r requirements-base.txt

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: |
            pip-audit-base.json

  frontend-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run npm audit
        working-directory: apps/paper_trading_web/frontend
        run: |
          npm audit --package-lock-only --audit-level=high --json > npm-audit.json || true
          npm audit --package-lock-only --audit-level=high

      - name: Upload npm audit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: apps/paper_trading_web/frontend/npm-audit.json
