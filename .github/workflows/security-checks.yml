name: Security Checks

on:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_deps: ${{ steps.scope.outputs.python_deps }}
      frontend_deps: ${{ steps.scope.outputs.frontend_deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect dependency changes
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PYTHON_DEPS: >-
            requirements-base.txt requirements-dev.txt .github/workflows/security-checks.yml
          FRONTEND_DEPS: >-
            apps/paper_trading_web/frontend/package-lock.json .github/workflows/security-checks.yml
        run: |
          python3 scripts/ci/changed_scope.py "origin/$BASE_REF" \
            "python_deps=$PYTHON_DEPS" \
            "frontend_deps=$FRONTEND_DEPS" >> "$GITHUB_OUTPUT"

  python-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit for base and dev dependencies
        run: pip-audit -r requirements-dev.txt

  frontend-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run npm audit
        working-directory: apps/paper_trading_web/frontend
        run: npm audit --package-lock-only --audit-level=high
