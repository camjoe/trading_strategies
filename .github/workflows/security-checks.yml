name: Security Checks

on:
  push:
    branches:
      - main
      - develop
    paths:
      - requirements-base.txt
      - requirements-dev.txt
      - apps/paper_trading_web/frontend/package-lock.json
      - .github/workflows/security-checks.yml
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: security-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_deps: ${{ steps.filter.outputs.python_deps }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect dependency changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python_deps:
              - requirements-base.txt
              - requirements-dev.txt
              - .github/workflows/security-checks.yml
            frontend_deps:
              - apps/paper_trading_web/frontend/package-lock.json
              - .github/workflows/security-checks.yml

  python-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit for base and dev dependencies
        run: pip-audit -r requirements-dev.txt

  frontend-audit:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_deps == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run npm audit
        working-directory: apps/paper_trading_web/frontend
        run: npm audit --package-lock-only --audit-level=high
