name: Frontend Tests

on:
  push:
    branches:
      - main
    paths:
      - paper_trading_ui/frontend/**
      - .github/workflows/frontend-tests.yml
  pull_request:

concurrency:
  group: frontend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_related: ${{ steps.filter.outputs.frontend_related }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect frontend-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend_related:
              - paper_trading_ui/frontend/**
              - .github/workflows/frontend-tests.yml

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: paper_trading_ui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: paper_trading_ui/frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: paper_trading_ui/frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: paper_trading_ui/frontend/coverage
