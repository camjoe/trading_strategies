name: Quality Gates

on:
  push:
    branches:
      - main
    paths:
      - src/trading/**
      - apps/trends/**
      - apps/paper_trading_web/backend/**
      - apps/paper_trading_web/frontend/**
      - docs/**
      - scripts/**
      - .ai/**
      - AGENTS.md
      - .editorconfig
      - .gitattributes
      - requirements-base.txt
      - requirements-dev.txt
      - .github/workflows/quality-gates.yml
  pull_request:

concurrency:
  group: quality-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_related: ${{ steps.filter.outputs.python_related }}
      frontend_related: ${{ steps.filter.outputs.frontend_related }}
      docs_enforcement_related: ${{ steps.filter.outputs.docs_enforcement_related }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect quality gate scope
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python_related:
              - src/trading/**
              - apps/trends/**
              - apps/paper_trading_web/backend/**
              - requirements-base.txt
              - requirements-dev.txt
              - .github/workflows/quality-gates.yml
            frontend_related:
              - apps/paper_trading_web/frontend/**
              - requirements-base.txt
              - requirements-dev.txt
              - .github/workflows/quality-gates.yml
            docs_enforcement_related:
              - docs/**
              - scripts/**
              - .ai/**
              - AGENTS.md
              - .editorconfig
              - .gitattributes
              - apps/paper_trading_web/backend/routes/**
              - apps/paper_trading_web/frontend/src/assets/**
              - requirements-base.txt
              - requirements-dev.txt
              - .github/workflows/quality-gates.yml

  python-quality:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install Python dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run repository quality gates
        run: python -m scripts.run_checks repo

      - name: Run Python quality gates
        run: python -m scripts.run_checks python --no-cov

  frontend-quality:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/paper_trading_web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/paper_trading_web/frontend
        run: npm ci

      - name: Run frontend lint gate
        working-directory: apps/paper_trading_web/frontend
        run: npm run lint

      - name: Run frontend typecheck gate
        working-directory: apps/paper_trading_web/frontend
        run: npm run typecheck

  docs-enforcement:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docs_enforcement_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run documentation and safety enforcement
        run: |
          python -m scripts.run_checks docs
          python -m scripts.run_checks repo
