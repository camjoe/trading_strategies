name: Python Tests

on:
  push:
    branches:
      - main
    paths:
      - trading/**
      - trends/**
      - tests/**
      - paper_trading_ui/backend/**
      - paper_trading_ui/__init__.py
      - requirements-base.txt
      - requirements-dev.txt
      - pytest.ini
      - .coveragerc
      - .github/workflows/python-tests.yml
  pull_request:

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_related: ${{ steps.filter.outputs.python_related }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect python-related changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python_related:
              - trading/**
              - trends/**
              - tests/**
              - paper_trading_ui/backend/**
              - paper_trading_ui/__init__.py
              - requirements-base.txt
              - requirements-dev.txt
              - pytest.ini
              - .coveragerc
              - .github/workflows/python-tests.yml

  test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
