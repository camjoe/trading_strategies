name: Targeted Tests

on:
  workflow_dispatch:
    inputs:
      suites:
        description: >
          Space- or comma-separated suite names to run, OR leave blank to
          auto-detect from changed files vs the base branch.
          Suite names mirror the tests/ directory tree (e.g. "src/trading/services",
          "src/trading/services/market_data src/trading/services/promotion").
          Use "all" to run the full suite.
        required: false
        default: ""
      base_ref:
        description: >
          Git ref to diff against for auto-detection (e.g. "main", "origin/main").
          Only used when "suites" is left blank.
        required: false
        default: "origin/main"
      extra_args:
        description: "Extra pytest flags (e.g. --no-cov -v)"
        required: false
        default: ""

jobs:
  targeted-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run targeted suite (explicit)
        if: inputs.suites != ''
        run: |
          SUITES=$(echo "${{ inputs.suites }}" | tr ',' ' ')
          python -m scripts.checks.run_suite $SUITES ${{ inputs.extra_args }}

      - name: Run targeted suite (auto-detect from changes)
        if: inputs.suites == ''
        run: |
          python -m scripts.checks.run_suite --base ${{ inputs.base_ref }} ${{ inputs.extra_args }}

