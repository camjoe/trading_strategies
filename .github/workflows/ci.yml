name: CI

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - apps/trends/**
      - apps/paper_trading_web/backend/**
      - apps/paper_trading_web/frontend/**
      - apps/paper_trading_web/__init__.py
      - tests/**
      - docs/**
      - scripts/**
      - .ai/**
      - AGENTS.md
      - .editorconfig
      - .gitattributes
      - pytest.ini
      - pyproject.toml
      - ruff.toml
      - requirements-base.txt
      - requirements-dev.txt
      - .github/workflows/ci.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python_related: ${{ steps.scope.outputs.python_related }}
      frontend_related: ${{ steps.scope.outputs.frontend_related }}
      docs_enforcement_related: ${{ steps.scope.outputs.docs_enforcement_related }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect quality gate scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PYTHON_RELATED: >-
            src apps/trends apps/paper_trading_web/backend apps/paper_trading_web/__init__.py tests pytest.ini
            pyproject.toml ruff.toml requirements-base.txt requirements-dev.txt .github/workflows/ci.yml
          FRONTEND_RELATED: >-
            apps/paper_trading_web/frontend .github/workflows/ci.yml
          DOCS_ENFORCEMENT_RELATED: >-
            docs scripts .ai AGENTS.md .editorconfig .gitattributes apps/paper_trading_web/backend/routes
            apps/paper_trading_web/frontend/src/assets requirements-base.txt requirements-dev.txt
            .github/workflows/ci.yml
        run: |
          python3 scripts/ci/changed_scope.py "origin/$BASE_REF" \
            "python_related=$PYTHON_RELATED" \
            "frontend_related=$FRONTEND_RELATED" \
            "docs_enforcement_related=$DOCS_ENFORCEMENT_RELATED" >> "$GITHUB_OUTPUT"

  python:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install Python dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Python lint, type, and test gates
        run: python -m scripts.run_checks python

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/paper_trading_web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/paper_trading_web/frontend
        run: npm ci

      - name: Run frontend lint gate
        working-directory: apps/paper_trading_web/frontend
        run: npm run lint

      - name: Run frontend typecheck gate
        working-directory: apps/paper_trading_web/frontend
        run: npm run typecheck

      - name: Run frontend tests with coverage
        working-directory: apps/paper_trading_web/frontend
        run: npm run test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: apps/paper_trading_web/frontend/coverage

  static-checks:
    needs: changes
    if: >-
      github.event_name != 'pull_request'
      || needs.changes.outputs.python_related == 'true'
      || needs.changes.outputs.frontend_related == 'true'
      || needs.changes.outputs.docs_enforcement_related == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            requirements-base.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run documentation and safety enforcement
        run: |
          python -m scripts.run_checks docs
          python -m scripts.run_checks repo
