[pytest]
testpaths = tests
# apps/ and src/ packages (infrastructure, paper_trading_web, trends) are made
# importable by the editable install (pip install -e .); see pyproject.toml.
addopts = -q --cov=trading --cov=common --cov=src/infrastructure --cov=paper_trading_web.backend --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -n auto
filterwarnings =
    ignore::DeprecationWarning:vaderSentiment
