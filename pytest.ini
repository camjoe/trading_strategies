[pytest]
testpaths = tests
# apps/ and src/ packages (infrastructure, paper_trading_web, trends) are made
# importable by the editable install (pip install -e .); see pyproject.toml.
addopts = -q --cov=src/trading --cov=src/backtesting --cov=src/common --cov=src/infrastructure --cov=apps/paper_trading_web/backend --cov-report=term-missing --cov-report=xml --cov-fail-under=70 -n auto
markers =
    integration: a flow that crosses several services against a real database, no external process
    e2e: a full workflow driven through a real entrypoint (CLI or runtime job)
filterwarnings =
    ignore::DeprecationWarning:vaderSentiment
